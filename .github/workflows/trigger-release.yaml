name: Deploy to Production
# Deploys to the production Konnect control plane on every push to the production branch.
# Promote by merging main into production: git push origin main:production
on:
  push:
    branches:
      - 'production'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  ENVIRONMENT: production

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      production-apps-list: ${{ steps.set-apps.outputs.production-apps-list }}

    steps:
      - name: Set production apps list
        id: set-apps
        run: |
          # Space-separated list of APIs to deploy to production.
          # Each name must correspond to a folder under apis/.
          PRODUCTION_APPS="alice bob"
          echo "production-apps-list=$PRODUCTION_APPS" >> $GITHUB_OUTPUT
          echo "Production apps list: $PRODUCTION_APPS"

  kong-pipeline:
    name: Validate APIs
    needs: setup
    uses: ./.github/workflows/validate-apis.yaml
    with:
      apps_list: ${{ needs.setup.outputs.production-apps-list }}

  deck-lint:
    name: Lint Deck Config
    needs: setup
    # Blocking gate: lint the generated deck config before any write to production Konnect.
    uses: ./.github/workflows/lint-deck.yaml
    with:
      apps_list: ${{ needs.setup.outputs.production-apps-list }}

  resolve-secrets:
    name: Resolve Secrets
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      konnect_token: ${{ steps.token.outputs.konnect_token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Konnect token
        id: token
        # READ_FROM_OPENBAO=true  → fetch KPAT from OpenBao via scripts/kpat.sh
        # READ_FROM_OPENBAO=false → use the KONNECT_TOKEN secret directly
        env:
          VAULT_ADDR: https://openbao.shared.pve-home.schenkeveld.io
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
        run: |
          if [ "${{ vars.READ_FROM_OPENBAO }}" = "true" ]; then
            TOKEN="$(./scripts/kpat.sh)"
          else
            TOKEN="$KONNECT_TOKEN"
          fi
          echo "konnect_token=$TOKEN" >> $GITHUB_OUTPUT

  kong-backup:
    name: Backup Kong State
    needs: [setup, kong-pipeline, deck-lint, resolve-secrets]
    if: needs.kong-pipeline.result == 'success' && needs.deck-lint.result == 'success'
    uses: ./.github/workflows/backup-kong-control-plane.yaml
    with:
      environment: "production"
      control_plane_name: "apiops-production"
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  kong-global:
    name: Deploy Global Components to Production
    needs: [setup, kong-pipeline, kong-backup, resolve-secrets]
    if: needs.kong-pipeline.result == 'success' && needs.kong-backup.result == 'success'
    uses: ./.github/workflows/deploy-global-components.yaml
    with:
      environment: production
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  kong-deploy:
    name: Deploy to Kong Production
    needs: [setup, kong-pipeline, kong-backup, kong-global, resolve-secrets]
    if: needs.kong-pipeline.result == 'success' && needs.kong-backup.result == 'success' && needs.kong-global.result == 'success'
    uses: ./.github/workflows/deploy-apis.yaml
    with:
      environment: production
      apps_list: ${{ needs.setup.outputs.production-apps-list }}
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  kong-verify:
    name: Verify Kong Production Deployment
    needs: [setup, kong-pipeline, kong-backup, kong-global, kong-deploy, resolve-secrets]
    if: needs.kong-deploy.result == 'success'
    uses: ./.github/workflows/verify-deployment.yaml
    with:
      environment: production
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  publish-catalog:
    name: Publish to API Catalog
    needs: [setup, kong-pipeline, kong-backup, kong-global, kong-deploy, kong-verify, resolve-secrets]
    if: needs.kong-verify.result == 'success'
    uses: ./.github/workflows/publish-to-catalog.yaml
    with:
      apps_list: ${{ needs.setup.outputs.production-apps-list }}
      konnect_region: eu
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  release-summary:
    name: Release Summary
    needs: [setup, kong-pipeline, deck-lint, resolve-secrets, kong-backup, kong-global, kong-deploy, kong-verify, publish-catalog]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Release deployment summary
        run: |
          echo "# Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- Control Plane: apiops-production" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Pipeline Results:**" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Kong Pipeline | ${{ needs.kong-pipeline.result == 'success' && '✅ Success' || '❌ Failed' }} | API validation and breaking changes check |" >> $GITHUB_STEP_SUMMARY
          echo "| Deck Lint | ${{ needs.deck-lint.result == 'success' && '✅ Success' || '❌ Failed' }} | Deck config linting |" >> $GITHUB_STEP_SUMMARY
          echo "| Kong Backup | ${{ needs.kong-backup.result == 'success' && '✅ Success' || '❌ Failed' }} | Production control plane backup |" >> $GITHUB_STEP_SUMMARY
          echo "| Global Components | ${{ needs.kong-global.result == 'success' && '✅ Success' || '❌ Failed' }} | Consumer groups, consumers, plugins |" >> $GITHUB_STEP_SUMMARY
          echo "| Kong Deploy | ${{ needs.kong-deploy.result == 'success' && '✅ Success' || '❌ Failed' }} | API deployment to production |" >> $GITHUB_STEP_SUMMARY
          echo "| Kong Verify | ${{ needs.kong-verify.result == 'success' && '✅ Success' || '❌ Failed' }} | Production deployment verification |" >> $GITHUB_STEP_SUMMARY
          echo "| API Catalog | ${{ needs.publish-catalog.result == 'success' && '✅ Success' || '❌ Failed' }} | APIs published to catalog and portals |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.kong-pipeline.result }}" == "success" && "${{ needs.deck-lint.result }}" == "success" && "${{ needs.kong-backup.result }}" == "success" && "${{ needs.kong-global.result }}" == "success" && "${{ needs.kong-deploy.result }}" == "success" && "${{ needs.kong-verify.result }}" == "success" && "${{ needs.publish-catalog.result }}" == "success" ]]; then
            echo "## Production deployment completed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Production deployment failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs for the failed pipeline stages above." >> $GITHUB_STEP_SUMMARY
          fi
