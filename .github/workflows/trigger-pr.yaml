name: PR Validation
# Runs on every PR against main. Validates specs and generates docs but does NOT deploy anything.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  setup-apps:
    name: Setup Apps Configuration
    runs-on: ubuntu-latest
    outputs:
      all-apps-list: ${{ steps.set-apps.outputs.all-apps-list }}
    steps:
      - name: Set PR validation apps list
        id: set-apps
        run: |
          # Space-separated list of all APIs to validate on every PR.
          # Each name must correspond to a folder under apis/.
          ALL_APPS="httpbin company company-mocked domain domain-mocked domain-users domain-users-mocked portal portal-mocked portal-users portal-users-mocked"
          echo "all-apps-list=$ALL_APPS" >> $GITHUB_OUTPUT
          echo "PR validation apps list: $ALL_APPS"

  kong-pipeline:
    name: Validate APIs
    needs: setup-apps
    # Validates OAS specs, lints, checks semver and breaking changes for every app.
    uses: ./.github/workflows/validate-apis.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}

  deck-lint:
    name: Lint Deck Config
    needs: setup-apps
    # Builds each API's deck file and lints it (blocking). Deck-level counterpart to the OAS lint.
    uses: ./.github/workflows/lint-deck.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}

  generate-docs:
    name: Generate Documentation
    needs: [setup-apps, kong-pipeline]
    # Dry-run doc generation: confirms Redocly can build docs but does not publish.
    uses: ./.github/workflows/generate-and-publish-documentation.yaml
    with:
      environment: "dev"
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}
      deploy_docs: false

  pr-summary:
    name: PR Summary
    needs: [setup-apps, kong-pipeline, deck-lint, generate-docs]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: PR Validation Summary
        run: |
          echo "# 🔍 Pull Request Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- PR Number: ${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Source branch: ${{ github.event.pull_request.head.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Target branch: ${{ github.event.pull_request.base.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Validation Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Kong pipeline status: ${{ needs.kong-pipeline.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deck lint status: ${{ needs.deck-lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation generation status: ${{ needs.generate-docs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [[ "${{ needs.kong-pipeline.result }}" == "success" && "${{ needs.deck-lint.result }}" == "success" && "${{ needs.generate-docs.result }}" == "success" ]]; then
            echo "## ✅ All validations passed!" >> $GITHUB_STEP_SUMMARY
            echo "This PR is ready for review and merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Some validations failed" >> $GITHUB_STEP_SUMMARY
            echo "Please review the failed jobs and fix any issues before merging." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review any validation failures above" >> $GITHUB_STEP_SUMMARY
          echo "2. Check the generated documentation artifacts" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify breaking changes (if any) are properly documented" >> $GITHUB_STEP_SUMMARY
          echo "4. Ensure version increments match the scope of changes" >> $GITHUB_STEP_SUMMARY

