name: Publish to API Catalog
# Reusable workflow: for each app in apps_list, reads apis/$APP/konnect.yaml and
# publishes to the Konnect API Catalog + developer portals if catalog: true.
# All IDs are resolved by name at runtime.

on:
  workflow_call:
    inputs:
      apps_list:
        description: 'Space-separated list of apps to publish'
        required: true
        type: string
      konnect_region:
        description: 'Konnect region'
        required: false
        type: string
        default: 'eu'
    secrets:
      KONNECT_TOKEN:
        required: true

jobs:
  publish-catalog:
    name: To Konnect API Catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kongctl
        run: |
          RELEASE=$(curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/Kong/kongctl/releases/latest)
          echo "Available assets:"; echo "$RELEASE" | jq -r '.assets[].name'
          ASSET_URL=$(echo "$RELEASE" | jq -r '
            .assets[] | select(.name == "kongctl_linux_amd64.zip")
            | .browser_download_url')
          [ -n "$ASSET_URL" ] || { echo "Failed to resolve kongctl release URL"; exit 1; }
          curl -L "$ASSET_URL" -o kongctl.zip
          unzip -q kongctl.zip kongctl
          sudo mv kongctl /usr/local/bin/
          kongctl version

      - name: To Konnect API Catalog
        env:
          KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
          KONNECT_REGION: ${{ inputs.konnect_region }}
          APPS_LIST: ${{ inputs.apps_list }}
        run: ./scripts/publish-api.sh

      - name: To Konnect Dev Portal (production)
        env:
          KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
          KONNECT_REGION: ${{ inputs.konnect_region }}
          APPS_LIST: ${{ inputs.apps_list }}
        run: |
          BASE_URL="https://${KONNECT_REGION}.api.konghq.com"
          for APP in $APPS_LIST; do
            CATALOG_NAME="${APP}-dev"
            ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$CATALOG_NAME")
            ID=$(curl -sf -H "Authorization: Bearer $KONNECT_TOKEN" \
              "${BASE_URL}/v3/apis?filter%5Bname%5D=${ENCODED}" | jq -r '.data[0].id // empty')
            if [ -n "$ID" ]; then
              echo "✅ ${CATALOG_NAME} live on dev portal"
            else
              echo "❌ ${CATALOG_NAME} not found in catalog" && exit 1
            fi
          done

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ Published' || '❌ Failed' }}"
          echo "# 📖 API Catalog" >> $GITHUB_STEP_SUMMARY
          echo "| Apps | Region | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ inputs.apps_list }} | ${{ inputs.konnect_region }} | $STATUS |" >> $GITHUB_STEP_SUMMARY
