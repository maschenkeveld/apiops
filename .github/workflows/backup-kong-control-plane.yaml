name: Kong Backup
# Reusable workflow: dumps the full Konnect control plane state to a YAML file
# and uploads it as a GitHub Actions artifact (retained 30 days).
# Always runs before any write to Konnect so the state can be restored if a deployment fails.
# Future enhancement: push the dump to an S3 bucket for long-term retention.

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment name (development, production)'
        required: true
        type: string
      control_plane_name:
        description: 'Kong control plane name'
        required: true
        type: string
    secrets:
      KONNECT_TOKEN:
        description: 'Kong Konnect API token'
        required: true

env:
  KONNECT_ADDR: https://eu.api.konghq.com
  KONNECT_CONTROL_PLANE_NAME: ${{ inputs.control_plane_name }}
  KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
  DECK_VERSION: "1.49.1"

jobs:
  validate-inputs:
    name: Validate Input Parameters
    runs-on: ubuntu-latest
    outputs:
      is-valid: ${{ steps.validate.outputs.is-valid }}
    steps:
      - name: Validate environment input
        id: validate
        run: |
          # Guard against accidental deployments to undefined environments.
          if [[ "${{ inputs.environment }}" == "development" || "${{ inputs.environment }}" == "production" ]]; then
            echo "✅ Valid environment: ${{ inputs.environment }}"
            echo "is-valid=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Invalid environment: ${{ inputs.environment }}"
            echo "Supported environments: development, production"
            echo "is-valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  backup:
    name: Backup Kong Control Plane State
    needs: validate-inputs
    runs-on: ubuntu-latest
    if: needs.validate-inputs.outputs.is-valid == 'true'
    outputs:
      backup-filename: ${{ steps.backup.outputs.filename }}
      backup-success: ${{ steps.backup.outputs.success }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install deck
        # Download the official deck release (linux/amd64).
        run: |
          echo "Installing Kong deck CLI version ${{ env.DECK_VERSION }}..."
          curl -sL "https://github.com/Kong/deck/releases/download/v${{ env.DECK_VERSION }}/deck_${{ env.DECK_VERSION }}_linux_amd64.tar.gz" -o deck.tar.gz
          sudo tar -xzf deck.tar.gz -C /usr/local/bin deck
          sudo chmod +x /usr/local/bin/deck
          echo "✅ deck CLI installed successfully"

      - name: Dump Kong Data
        id: backup
        # Shared script — same one the local runner uses. Prints the backup file path on stdout.
        run: |
          FILE=$(./scripts/backup.sh "${{ inputs.control_plane_name }}" "${{ inputs.environment }}")
          echo "filename=$(basename "$FILE")" >> $GITHUB_OUTPUT
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Upload Kong Control Plane Backup
        uses: actions/upload-artifact@v7
        if: steps.backup.outputs.success == 'true'
        with:
          name: ${{ steps.backup.outputs.filename }}
          path: backups/${{ steps.backup.outputs.filename }}
          retention-days: 30

  summary:
    name: Backup Summary
    needs: [validate-inputs, backup]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create backup summary
        run: |
          echo "# 💾 Kong Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Control Plane:** ${{ inputs.control_plane_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backup Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Validation status
          if [[ "${{ needs.validate-inputs.result }}" == "success" ]]; then
            echo "✅ **Input Validation:** Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Input Validation:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Backup status
          if [[ "${{ needs.backup.result }}" == "success" ]]; then
            echo "✅ **Backup Operation:** Successful" >> $GITHUB_STEP_SUMMARY
            echo "📁 **Backup File:** \`${{ needs.backup.outputs.backup-filename }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Backup Operation:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [[ "${{ needs.backup.result }}" == "success" ]]; then
            echo "## ✅ Backup completed successfully!" >> $GITHUB_STEP_SUMMARY
            echo "Kong control plane state has been backed up and is available as an artifact." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Backup failed" >> $GITHUB_STEP_SUMMARY
            echo "Kong backup operation encountered errors. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
