name: Deploy to Development
# Deploys to the development Konnect control plane on every push to main.
# Jobs are chained: each only runs if the previous succeeded, ensuring
# the backup always exists before any write to Konnect occurs.
on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

env:
  ENVIRONMENT: development

jobs:
  setup-apps:
    name: Setup Apps Configuration
    runs-on: ubuntu-latest
    outputs:
      all-apps-list: ${{ steps.set-apps.outputs.all-apps-list }}
    steps:
      - name: Set development apps list
        id: set-apps
        run: |
          # Space-separated list of APIs to deploy on merge to main.
          # Each name must correspond to a folder under apis/.
          ALL_APPS="alice"
          echo "all-apps-list=$ALL_APPS" >> $GITHUB_OUTPUT
          echo "Development apps list: $ALL_APPS"

  kong-pipeline:
    name: Validate APIs
    needs: setup-apps
    # Gate: all downstream deploy jobs depend on this succeeding.
    uses: ./.github/workflows/validate-apis.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}

  deck-lint:
    name: Lint Deck Config
    needs: setup-apps
    # Blocking gate: lint the generated deck config before any write to Konnect.
    uses: ./.github/workflows/lint-deck.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}

  resolve-secrets:
    name: Resolve Secrets
    needs: setup-apps
    runs-on: ubuntu-latest
    outputs:
      konnect_token: ${{ steps.token.outputs.konnect_token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Konnect token
        id: token
        env:
          VAULT_ADDR: https://openbao.shared.pve-home.schenkeveld.io
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
        run: |
          if [ "${{ vars.READ_FROM_OPENBAO }}" = "true" ]; then
            TOKEN="$(./scripts/kpat.sh)"
          else
            TOKEN="$KONNECT_TOKEN"
          fi
          echo "konnect_token=$TOKEN" >> $GITHUB_OUTPUT
          echo "::add-mask::$TOKEN"

  kong-backup:
    name: Backup Kong State
    needs: [setup-apps, kong-pipeline, deck-lint, resolve-secrets]
    if: ${{ needs.kong-pipeline.result == 'success' && needs.deck-lint.result == 'success' }}
    uses: ./.github/workflows/backup-kong-control-plane.yaml
    with:
      environment: development
      control_plane_name: apiops-development
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  kong-global:
    name: Deploy Global Components
    needs: [setup-apps, kong-pipeline, kong-backup, resolve-secrets]
    if: ${{ needs.kong-pipeline.result == 'success' && needs.kong-backup.result == 'success' }}
    uses: ./.github/workflows/deploy-global-components.yaml
    with:
      environment: development
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  kong-deploy:
    name: Deploy to Kong
    needs: [setup-apps, kong-pipeline, kong-backup, kong-global, resolve-secrets]
    if: ${{ needs.kong-pipeline.result == 'success' && needs.kong-backup.result == 'success' && needs.kong-global.result == 'success' }}
    uses: ./.github/workflows/deploy-apis.yaml
    with:
      environment: development
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  kong-verify:
    name: Verify Kong Deployment
    needs: [setup-apps, kong-pipeline, kong-backup, kong-global, kong-deploy, resolve-secrets]
    if: ${{ needs.kong-deploy.result == 'success' }}
    uses: ./.github/workflows/verify-deployment.yaml
    with:
      environment: development
    secrets:
      KONNECT_TOKEN: ${{ needs.resolve-secrets.outputs.konnect_token }}

  documentation:
    name: Generate API Documentation
    needs: [setup-apps, kong-pipeline, kong-backup, kong-global, kong-deploy, kong-verify]
    if: ${{ needs.kong-verify.result == 'success' }}
    # Builds HTML docs from the OpenAPI spec and uploads them as pipeline artifacts.
    uses: ./.github/workflows/generate-and-publish-documentation.yaml
    with:
      environment: development
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}

  notify:
    name: Notify Deployment
    needs: [setup-apps, kong-pipeline, deck-lint, resolve-secrets, kong-backup, kong-global, kong-deploy, kong-verify, documentation]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment notification
        run: |
          echo "Dev deployment completed"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Kong pipeline status: ${{ needs.kong-pipeline.result }}"
          echo "Deck lint status: ${{ needs.deck-lint.result }}"
          echo "Kong backup status: ${{ needs.kong-backup.result }}"
          echo "Kong global status: ${{ needs.kong-global.result }}"
          echo "Kong deploy status: ${{ needs.kong-deploy.result }}"
          echo "Kong verify status: ${{ needs.kong-verify.result }}"
          echo "Documentation status: ${{ needs.documentation.result }}"
          if [ "${{ needs.kong-pipeline.result }}" = "success" ] && [ "${{ needs.deck-lint.result }}" = "success" ] && [ "${{ needs.kong-backup.result }}" = "success" ] && [ "${{ needs.kong-global.result }}" = "success" ] && [ "${{ needs.kong-deploy.result }}" = "success" ] && [ "${{ needs.kong-verify.result }}" = "success" ] && [ "${{ needs.documentation.result }}" = "success" ]; then
            echo "✅ Deployment, verification, and documentation successful"
          else
            echo "❌ Deployment, verification, or documentation failed"
          fi
