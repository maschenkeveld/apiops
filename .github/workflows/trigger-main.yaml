name: Deploy to Development
# Deploys to the development Konnect control plane on every push to main.
# Jobs are chained so the per-API sequence is always enforced:
#   Validate OAS → Generate Deck (once) → Lint Deck → Global Components → Deploy APIs → Verify
#   → Publish Catalog → Publish Portal
# The deck is generated exactly once; lint and deploy consume that artifact. Global components
# deploy before APIs, and each deploy stage backs up the control plane before writing.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_global:
        description: 'Deploy global components even with no global/ changes (bootstrap a reset control plane)'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  ENVIRONMENT: development

jobs:
  setup-apps:
    name: Setup Apps Configuration
    runs-on: ubuntu-latest
    outputs:
      all-apps-list: ${{ steps.set-apps.outputs.all-apps-list }}
    steps:
      - name: Set development apps list
        id: set-apps
        run: |
          # Space-separated list of APIs to deploy on merge to main.
          # Each name must correspond to a folder under apis/.
          ALL_APPS="alice bob"
          echo "all-apps-list=$ALL_APPS" >> $GITHUB_OUTPUT
          echo "Development apps list: $ALL_APPS"

  kong-pipeline:
    name: Validate API Specs
    needs: setup-apps
    # Step 1 — Validate OAS. Gate: all downstream jobs depend on this succeeding.
    uses: ./.github/workflows/validate-apis.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}

  kong-generate:
    name: Generate Deck Config
    needs: [setup-apps, kong-pipeline]
    # Step 2 — Generate the deck config ONCE per app and upload it as an artifact.
    # lint and deploy download this exact artifact; nothing regenerates it.
    if: ${{ needs.kong-pipeline.result == 'success' }}
    uses: ./.github/workflows/generate-deck.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}

  deck-lint:
    name: Lint Deck Config
    needs: [setup-apps, kong-generate]
    # Step 3 — Blocking gate: lint the generated deck artifact before any write to Konnect.
    if: ${{ needs.kong-generate.result == 'success' }}
    uses: ./.github/workflows/lint-deck.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}

  kong-global:
    name: Deploy Global Components
    needs: [setup-apps, deck-lint]
    # Step 4 — Global components deploy FIRST (APIs reference consumer groups + partials).
    # This workflow backs up the control plane before syncing.
    if: ${{ needs.deck-lint.result == 'success' }}
    uses: ./.github/workflows/deploy-global-components.yaml
    with:
      environment: development
      # On a normal push, global only deploys when global/ changes. A manual dispatch with
      # force_global: true deploys it regardless — used to bootstrap a freshly reset control plane.
      force_deploy: ${{ inputs.force_global == true }}
    secrets:
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}

  kong-deploy:
    name: Deploy to Development
    needs: [setup-apps, kong-generate, kong-global]
    # Step 5 — Deploy APIs sequentially (max-parallel: 1). Each app: backup → diff → sync,
    # consuming the generated artifact. Runs only after global components succeed.
    if: ${{ needs.kong-global.result == 'success' }}
    uses: ./.github/workflows/deploy-apis.yaml
    with:
      environment: development
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}
    secrets:
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}

  kong-verify:
    name: Verify Deployment
    needs: [setup-apps, kong-deploy]
    # Step 6 — Verify the deployment.
    if: ${{ needs.kong-deploy.result == 'success' }}
    uses: ./.github/workflows/verify-deployment.yaml
    with:
      environment: development
    secrets:
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}

  publish-catalog:
    name: Publish to Catalog
    needs: [setup-apps, kong-verify]
    # Step 7 — Publish APIs to the API Catalog.
    if: ${{ needs.kong-verify.result == 'success' }}
    uses: ./.github/workflows/publish-to-catalog.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}
      konnect_region: eu
    secrets:
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}

  publish-portal:
    name: Publish to Portal
    needs: [setup-apps, kong-verify]
    # Step 8 — Publish APIs to the Developer Portal.
    if: ${{ needs.kong-verify.result == 'success' }}
    uses: ./.github/workflows/publish-to-portal.yaml
    with:
      apps_list: ${{ needs.setup-apps.outputs.all-apps-list }}
      konnect_region: eu
    secrets:
      KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}

  notify:
    name: Notify Deployment
    needs: [setup-apps, kong-pipeline, kong-generate, deck-lint, kong-global, kong-deploy, kong-verify, publish-catalog, publish-portal]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment notification
        run: |
          echo "Dev deployment completed"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Validate status: ${{ needs.kong-pipeline.result }}"
          echo "Generate status: ${{ needs.kong-generate.result }}"
          echo "Deck lint status: ${{ needs.deck-lint.result }}"
          echo "Kong global status: ${{ needs.kong-global.result }}"
          echo "Kong deploy status: ${{ needs.kong-deploy.result }}"
          echo "Kong verify status: ${{ needs.kong-verify.result }}"
          echo "Publish catalog status: ${{ needs.publish-catalog.result }}"
          echo "Publish portal status: ${{ needs.publish-portal.result }}"
          if [ "${{ needs.kong-pipeline.result }}" = "success" ] && [ "${{ needs.kong-generate.result }}" = "success" ] && [ "${{ needs.deck-lint.result }}" = "success" ] && [ "${{ needs.kong-global.result }}" = "success" ] && [ "${{ needs.kong-deploy.result }}" = "success" ] && [ "${{ needs.kong-verify.result }}" = "success" ] && [ "${{ needs.publish-catalog.result }}" = "success" ] && [ "${{ needs.publish-portal.result }}" = "success" ]; then
            echo "✅ Deployment, verification, and catalog + portal publication successful"
          else
            echo "❌ One or more pipeline jobs failed"
          fi
