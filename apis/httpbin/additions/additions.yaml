_format_version: '3.0'
_info:
  select_tags:
    - httpbin
    - v1
  default_lookup_tags:
    consumer_groups:
      - global-consumer-groups
plugins:
  - name: rate-limiting-advanced
    consumer_group: bronze
    route: httpbin_get
    _config: shared-rate-limiting-advanced
  - name: rate-limiting-advanced
    consumer_group: gold
    route: httpbin_get
    _config: shared-rate-limiting-advanced
    config:
      limit:
        - 10