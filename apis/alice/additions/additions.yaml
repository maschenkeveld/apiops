_format_version: '3.0'
_info:
  select_tags: # THIS SHOULD ALSO BE DYNAMICALLY SET
    - alice
    - v1
  default_lookup_tags:
    consumer_groups:
      - global-consumer-groups
    partials:
      - global-redis
plugins:
  - name: rate-limiting-advanced
    consumer_group: bronze
    route: alice_getidentify
    _config: shared-rate-limiting-advanced
    partials:
      # Reference the global redis partial by name; deck resolves the id at sync time via
      # _info.default_lookup_tags.partials (global-redis). Keeps the config free of hardcoded UUIDs.
      - name: shared-redis
        path: config.redis
  - name: rate-limiting-advanced
    consumer_group: gold
    route: alice_getidentify
    _config: shared-rate-limiting-advanced
    partials:
      - name: shared-redis
        path: config.redis
    config:
      limit:
        - 10