openapi: 3.0.0
info:
  title: bob
  version: 1.0.0

servers:
  - url: https://placeholder.com/

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://idp.example.com/realms/kong/protocol/openid-connect/token
          scopes: 
            openid: OpenID
            profile: Profile
  schemas:
    Upstream:
      type: object
      properties:
        host:
          type: string
        upstreams:
          type: array
          items:
            $ref: '#/components/schemas/Upstream'

    CrawlResponse:
      type: object
      properties:
        statusCode:
          type: integer
        name:
          type: string
        zone:
          type: string
        reason:
          type: string
          nullable: true
        incomingHeaders:
          type: object
          additionalProperties:
            type: string
        upstreamResponses:
          type: array
          items:
            $ref: '#/components/schemas/CrawlResponse'

    IdentifyResponse:
      type: object
      properties:
        statusCode:
          type: integer
        name:
          type: string
        zone:
          type: string
        reason:
          type: string
          nullable: true
        incomingHeaders:
          type: object
          additionalProperties:
            type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string

# security:
#   - ApiKeyAuth: []
#   - BearerAuth: []
#   - OAuth2: []

paths:
  /metrics:
    get:
      summary: Get metrics
      operationId: getMetrics
      tags: [Observability]
      description: Returns Prometheus-compatible metrics for the bob service including request counts, latencies, and error rates.
      # security:
      #   - ApiKeyAuth: []
      #   - BearerAuth: []
      responses:
        '200':
          description: Successful response

  /health:
    get:
      summary: Health Endpoint
      operationId: getHealth
      tags: [Observability]
      description: Returns the current health status of the bob service. Use this endpoint for liveness and readiness probes.
      # security:
      #   - ApiKeyAuth: []
      #   - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /identify:
    get:
      summary: Identify Endpoint
      operationId: getIdentify
      tags: [Bob]
      description: Returns identity information for the current request, including the service name, zone, and incoming request headers.
      # security:
      #   - ApiKeyAuth: []
      #   - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifyResponse'

  /crawl:
    post:
      summary: Crawl Endpoint
      operationId: postCrawl
      tags: [Bob]
      description: Recursively crawls a list of upstream services and returns the aggregated responses, useful for testing mesh connectivity.
      # security:
      #   - ApiKeyAuth: []
      #   - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                upstreams:
                  type: array
                  items:
                    $ref: '#/components/schemas/Upstream'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlResponse'
